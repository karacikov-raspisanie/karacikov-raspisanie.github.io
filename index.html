const modal=document.getElementById("modal"),mTitle=document.getElementById("mTitle"),mBody=document.getElementById("mBody");
let lastFocus=null;
function openModal(title){lastFocus=document.activeElement;mTitle.textContent=title;mBody.innerHTML="";modal.hidden=false;document.body.style.overflow="hidden"}
function closeModal(){modal.hidden=true;document.body.style.overflow="";if(lastFocus)try{lastFocus.focus()}catch(e){}}
document.getElementById("mClose").onclick=closeModal;
modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!modal.hidden)closeModal()},true);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LEAD_TABS=[["mvd","МВД"],["uni","Университет"],["inst","Институт"]];
function leadHtml(k){const L=LEAD[k];let html='<div class="lead-title">'+esc(L.title)+"</div>";
  L.sections.forEach(([sec,ps])=>{if(sec)html+='<div class="m-sec">'+esc(sec)+"</div>";else html+='<div class="m-sec" style="margin-top:8px"></div>';
    ps.forEach(p=>{html+='<div class="person'+(p[3]?" head":"")+'"><img class="av" src="'+p[4]+'" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'"><div><div class="nm">'+esc(p[0])+'</div><div class="ps">'+esc(p[1])+'</div><div class="rk">'+esc(p[2])+"</div></div></div>"})});return html}
let leadTab=(()=>{try{return localStorage.getItem("lead_tab")||"mvd"}catch(e){return "mvd"}})();
document.getElementById("leadBtn").onclick=()=>{openModal("Руководство");
  mBody.innerHTML='<div class="seg" role="tablist">'+LEAD_TABS.map(([k,t])=>'<button role="tab" data-k="'+k+'">'+t+"</button>").join("")+'</div><div id="leadBody"></div>';
  const show=k=>{leadTab=k;try{localStorage.setItem("lead_tab",k)}catch(e){}mBody.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-selected",b.dataset.k===k));document.getElementById("leadBody").innerHTML=leadHtml(k);mBody.scrollTop=0};
  mBody.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>show(b.dataset.k));show(leadTab);document.getElementById("mClose").focus()};
const ALL=RAW.split(";").map((r,i)=>{const[d,t,s,p,te]=r.split("|");return{d,t,s:+s,p:+p,te:+te,topic:fmtTopic(TP[TI[i]])}});
const norm=s=>s.toLowerCase().replace(/ё/g,"е");
function hl(text,q){const n=norm(text);let out="",i=0;if(!q)return esc(text);let j;while((j=n.indexOf(q,i))>=0){out+=esc(text.slice(i,j))+"<mark>"+esc(text.slice(j,j+q.length))+"</mark>";i=j+q.length}return out+esc(text.slice(i))}
function dateOf(d){const[dd,mm]=d.split(".");return new Date(YEAR,+mm-1,+dd)}
document.getElementById("searchBtn").onclick=()=>{openModal("Поиск по расписанию");
  mBody.innerHTML='<input class="s-input" id="sIn" type="search" placeholder="Предмет, преподаватель, тема, тип…" autocomplete="off"><div id="sOut"></div>';
  const inp=document.getElementById("sIn"),out=document.getElementById("sOut");
  const run=()=>{const q=norm(inp.value.trim());if(q.length<2){out.innerHTML='<div class="s-hint">Например: «Мельник», «зачёт», «Смутное время», «семинар»</div>';return}
    const words=q.split(/\s+/);
    const res=ALL.filter(x=>{const hay=norm([S[x.s],P[x.p],T[x.te],x.topic,RM[+RI[ALL.indexOf(x)]]].join(" "));return words.every(w=>hay.includes(w))});
    if(!res.length){out.innerHTML='<div class="s-hint">Ничего не найдено</div>';return}
    const upcoming=res.filter(x=>dateOf(x.d)>=todayMid).length;
    let html='<div class="s-hint">Найдено: '+res.length+(upcoming?" · впереди: "+upcoming:"")+"</div>";
    res.slice(0,150).forEach((x,i)=>{const dt=dateOf(x.d);

        setTimeout(()=>{window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-document.querySelector("header").offsetHeight-16,behavior:"smooth"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash")},30)}})};

const EXAM_TYPES=[4,5,6,7,9,8];
function jumpTo(x){closeModal();cur=monday(dateOf(x.d));setHash();render(false);
  const el=document.querySelector('[data-k="'+x.d+"|"+x.t+'"]');if(el){setTimeout(()=>{window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-document.querySelector("header").offsetHeight-16,behavior:"smooth"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash")},30)}}
function plural(n,a,b,c){const m=n%10,mm=n%100;return m==1&&mm!=11?a:(m>=2&&m<=4&&(mm<12||mm>14)?b:c)}
document.getElementById("examBtn").onclick=()=>{openModal("Зачёты и экзамены");
  const groups=[];ALL.forEach(x=>{if(!EXAM_TYPES.includes(x.p))return;const g=groups[groups.length-1];
    if(g&&g.d===x.d&&g.s===x.s&&g.p===x.p)g.items.push(x);else groups.push({d:x.d,s:x.s,p:x.p,items:[x]})});
  const up=groups.filter(g=>dateOf(g.d)>=todayMid),past=groups.filter(g=>dateOf(g.d)<todayMid);
  const cnt=k=>up.filter(g=>k.includes(g.p)).length;
  let html='<div class="ex-sum"><span>Экзамены: '+cnt([9])+'</span><span>Зачёты: '+cnt([4,6,7])+'</span><span>Контрольные: '+cnt([5])+'</span></div>';
  const row=(g,i,done)=>{const dt=dateOf(g.d),days=Math.round((dt-todayMid)/864e5),x=g.items[0],last=g.items[g.items.length-1];
    const when=done?"прошло":days===0?"сегодня":days===1?"завтра":"через "+days+" "+plural(days,"день","дня","дней");
    const tm=x.t+"–"+(END[last.t]||last.t);const tch=[...new Set(g.items.map(y=>T[y.te]))].join(", ");
    return '<button class="ex-item'+(done?" done":days<=3?" soon":"")+'" data-g="'+i+'"><div class="ex-day"><b>'+dt.getDate()+"</b><small>"+MON_S[dt.getMonth()]+"</small></div><div>"+
      '<div class="ex-when">'+when+" · "+DOW[dt.getDay()]+" · "+tm+'</div><div class="subj">'+esc(S[g.s])+'</div><div class="meta"><span class="type '+PC[g.p]+'">'+esc(P[g.p])+'</span><span class="teacher">'+esc(tch)+"</span></div>"+
      (x.topic&&!/Контроль, Прием$/.test(x.topic)?'<div class="st" style="font-size:13px;color:var(--muted);margin-top:5px">'+esc(x.topic)+"</div>":"")+"</div></button>"};
  const all=up.concat(past);
  if(up.length){html+='<div class="m-sec">Впереди</div>';up.forEach(g=>html+=row(g,all.indexOf(g),false))}
  else html+='<div class="s-hint">Впереди ничего нет</div>';
  if(past.length){html+='<div class="m-sec">Прошедшие</div>';past.slice().reverse().forEach(g=>html+=row(g,all.indexOf(g),true))}
  mBody.innerHTML=html;
  mBody.querySelectorAll(".ex-item").forEach(b=>b.onclick=()=>jumpTo(all[+b.dataset.g].items[0]));
  document.getElementById("mClose").focus()};

const OTR_SUBJ={"ОИБ":8,"ОПСД":1,"СПФП":7,"ДОВДРФВУСПР":5,"Административное право":0,"История России":6,"Высшая математика":4,"Физическая подготовка":9};
const OTR_FORM={"л":"Лекция","с":"Семинар","п":"Практическое занятие"};
const OTR_FORM_C={"л":"t-lec","с":"t-sem","п":"t-pr"};
const OTR_REASON={"Неуд":"неуд. оценка"};
const OTR_MARKS=["отр.","отл.","хор.","удов."];
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let otrBase=null,otrList=[],missMap={};
const formOf=p=>p===0?"л":p===1?"с":(p===2||p===3)?"п":null;
function otrBuild(){
  const marks=ls.get("otr_marks",{}),local=ls.get("otr_local",[]),hidden=ls.get("otr_hidden",[]);
  const base=(otrBase||[]).map(([s,tn,f,d,r,te,dd,mk],i)=>{const si=OTR_SUBJ[s];const lesson=ALL.find(x=>x.d===d&&x.s===si&&(x.topic||"").startsWith("Тема "+tn+"."))||ALL.find(x=>x.d===d&&x.s===si);
    return{id:"b"+i,s:si,name:si!=null?S[si]:s,tn,f,ft:null,d,r,te,dd,mk,lesson,local:false}});
  const loc=local.map(o=>{const lesson=ALL.find(x=>x.d===o.d&&x.t===o.t);return{id:o.id,s:lesson?lesson.s:null,name:lesson?S[lesson.s]:"Пара",tn:"",f:lesson?formOf(lesson.p):null,ft:lesson?P[lesson.p]:"",d:o.d,r:o.r,te:lesson?T[lesson.te]:"",dd:"",mk:"",lesson,local:true}});
  otrList=base.concat(loc).filter(o=>!hidden.includes(o.id)).map(o=>{const m=marks[o.id];if(m&&!o.dd){o.dd=m.dd;o.mk=m.mk}o.done=!!o.dd;return o});
  otrList.sort((a,b)=>dateOf(a.d)-dateOf(b.d)||((a.lesson&&a.lesson.t)||"").localeCompare((b.lesson&&b.lesson.t)||""));
  missMap={};otrList.forEach(o=>{if(o.lesson)missMap[o.lesson.d+"|"+o.lesson.t]=o});
  const open=otrList.filter(o=>!o.done).length,b=document.getElementById("otrBadge");b.textContent=open;b.hidden=!open;
}
function otrInit(){ls.del("otr_code");otrBase=[];otrBuild();render(false)}
const fmtDM=s=>{const[d,m]=s.split(".");return +d+" "+MON_S[+m-1]};
const todayDM=()=>key(new Date());
function otrRow(o,i){const dt=dateOf(o.d);
  return '<div class="otr-item'+(o.done?"":" open")+'" data-i="'+i+'"><div class="ex-day"><b>'+dt.getDate()+"</b><small>"+MON_S[dt.getMonth()]+'</small></div><div><div class="ex-when">'+(o.done?"отработано "+fmtDM(o.dd):"пропуск · "+DOW[dt.getDay()]+(o.lesson?" · "+o.lesson.t:""))+'</div><div class="subj">'+esc(o.name)+'</div><div class="meta">'+
  (o.f?'<span class="type '+OTR_FORM_C[o.f]+'">'+esc(OTR_FORM[o.f])+"</span>":o.ft?'<span class="type t-oth">'+esc(o.ft)+"</span>":"")+(o.r?'<span class="otr-reason">'+esc(OTR_REASON[o.r]||o.r)+"</span>":"")+
  (o.done?'<span class="otr-st done">'+esc(o.mk)+"</span>":'<span class="otr-st todo">нужно отработать</span>')+'<span class="teacher">'+esc(o.te)+"</span></div>"+
  '<div class="st" style="font-size:13px;color:var(--muted);margin-top:5px">'+esc(o.lesson&&o.lesson.topic?o.lesson.topic:(o.tn?"Тема "+o.tn:""))+"</div>"+

  if(open.length){html+='<div class="m-sec">Нужно отработать</div>';otrList.forEach((o,i)=>{if(!o.done)html+=otrRow(o,i)})}

  mBody.querySelectorAll(".otr-item").forEach(el=>el.onclick=e=>{const o=otrList[+el.dataset.i];const a=e.target.closest("[data-act]");
    if(a){e.stopPropagation();const act=a.dataset.act;
      if(act==="del"){if(a.dataset.sure){ls.set("otr_local",ls.get("otr_local",[]).filter(x=>x.id!==o.id));const mk=ls.get("otr_marks",{});delete mk[o.id];ls.set("otr_marks",mk);otrBuild();render(false);otrShowList()}else{a.dataset.sure=1;a.textContent="Точно удалить?"}return}
      if(act==="undo"){const mk=ls.get("otr_marks",{});delete mk[o.id];ls.set("otr_marks",mk);otrBuild();render(false);otrShowList();return}
      if(act==="done"){const box=el.querySelector(".otr-acts");box.innerHTML='<div class="otr-mark"><input type="date" class="s-input" value="'+new Date().toISOString().slice(0,10)+'"><select class="s-input">'+OTR_MARKS.map(m=>"<option>"+m+"</option>").join("")+'</select><button data-act="save">Сохранить</button></div>';return}

      return}

  document.getElementById("otrAdd").onclick=()=>{const box=document.getElementById("otrForm");if(box.innerHTML){box.innerHTML="";return}

    box.innerHTML='<div class="otr-addform"><label>Дата пропуска<input type="date" class="s-input" id="oaDate" min="'+iso(ALL[0].d)+'" max="'+iso(ALL[ALL.length-1].d)+'" value="'+(def?iso(def.d):"")+'"></label><div id="oaLessons"></div><label>Причина<select class="s-input" id="oaReason"><option>НХ</option><option>О</option><option value="Неуд">Неуд. оценка</option><option value="">Другая</option></select></label><button class="tool" id="oaSave" style="height:40px;padding:0 18px">Добавить</button><div class="s-hint" id="oaMsg"></div></div>';
    const di=document.getElementById("oaDate"),lb=document.getElementById("oaLessons");
    const fill=()=>{const v=di.value;if(!v){lb.innerHTML="";return}const[y,mo,dd]=v.split("-");const d=dd+"."+mo;const ls2=ALL.filter(x=>x.d===d);
      lb.innerHTML=ls2.length?'<div class="oa-list">'+ls2.map((x,i)=>'<label class="oa-opt"><input type="checkbox" value="'+x.t+'"><span><b>'+x.t+"</b> "+esc(S[x.s])+' <span class="muted-s">· '+esc(P[x.p])+"</span></span></label>").join("")+"</div>":'<div class="s-hint">В этот день пар нет</div>';lb.dataset.d=d};
    di.onchange=fill;di.oninput=fill;fill();
    document.getElementById("oaSave").onclick=()=>{const d=lb.dataset.d,ts=[...lb.querySelectorAll("input:checked")].map(i=>i.value);const msg=document.getElementById("oaMsg");
